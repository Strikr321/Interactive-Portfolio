<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tanvir Sublok, full stack developer (Java, Spring Boot, Angular, Vue). Projects, experience and resume." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="canonical" href="https://tanvir.sublok.dev/" />
    <meta name="theme-color" content="#09090b" />
    <!-- How the link looks when shared on LinkedIn, iMessage, Slack, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tanvir.sublok.dev/" />
    <meta property="og:title" content="Tanvir Sublok · Full Stack Developer" />
    <meta property="og:description" content="Full stack developer: Java, Spring Boot, Angular and Vue. Projects, experience and how to reach me." />
    <meta property="og:image" content="https://tanvir.sublok.dev/images/profile.jpg" />
    <meta name="twitter:card" content="summary" />
    <title>Tanvir Sublok · Full Stack Developer</title>
    <!-- Runs before React loads so the page doesn't flash the wrong theme -->
    <script>
      try {
        const t = localStorage.getItem('theme')
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch { document.documentElement.classList.add('dark') }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
